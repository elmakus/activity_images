name: Frontend checks
on:
  push:
    paths:
      - custom_components/activity_images/frontend/**
      - tests/frontend/**
      - package.json
      - package-lock.json
      - .github/workflows/frontend.yml
  pull_request:
    paths:
      - custom_components/activity_images/frontend/**
      - tests/frontend/**
      - package.json
      - package-lock.json
      - .github/workflows/frontend.yml
permissions:
  contents: read
jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:frontend
      - run: npm run test:frontend
