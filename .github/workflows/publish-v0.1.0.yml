name: Publish Activity Images v0.1.0
on:
  push:
    branches:
      - main
    paths:
      - docs/RELEASE_NOTES_v0.1.0.md

permissions:
  contents: write

jobs:
  first-release:
    name: Verify and publish v0.1.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install Pillow pytest pytest-asyncio aiohttp voluptuous ruff
      - name: Run tests
        run: |
          python -m compileall -q custom_components tests
          python -m pytest -q tests
          ruff check custom_components/activity_images tests --select F,E4,E7,E9
      - name: Check version and release notes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/activity_images/manifest.json").read_text())
          assert manifest["version"] == "0.1.0", "Manifest version must be 0.1.0"
          assert Path("docs/RELEASE_NOTES_v0.1.0.md").is_file(), "Missing release notes"
          PY
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master
      - name: Publish the first GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists; refusing to overwrite it."
            exit 0
          fi
          gh release create v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Activity Images v0.1.0" \
            --notes-file docs/RELEASE_NOTES_v0.1.0.md
