name: Python checks
on:
  push:
  pull_request:
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: >-
          python -m pip install Pillow pytest pytest-asyncio
          aiohttp probatio voluptuous ruff
      - run: python -m compileall -q custom_components tests
      - run: python -m pytest -q tests
      - run: >-
          ruff check custom_components/activity_images tests
          --select F,E4,E7,E9

  ha-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install target Home Assistant and conversation dependencies
        run: >-
          python -m pip install homeassistant==2026.11.0
          gazetteer-matcher==1.1.0 hassil==3.12.1
          home-assistant-intents==2026.10.27 pytest pytest-asyncio
      - run: python -m pytest -q tests
      - run: python tests/smoke_library_ha.py
      - run: python tests/smoke_settings_ha.py
      - run: python tests/smoke_ha_runtime.py
      - run: python tests/smoke_ai_wrapper_ha.py
      - run: python tests/smoke_calendar_startup_ha.py
