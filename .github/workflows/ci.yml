name: Python checks
on:
  push:
  pull_request:
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow pytest pytest-asyncio aiohttp voluptuous ruff
      - run: python -m compileall -q custom_components tests
      - run: python -m pytest -q tests
      - run: ruff check custom_components/activity_images tests --select F,E4,E7,E9
