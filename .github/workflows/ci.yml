name: Python checks
on:
  push:
  pull_request:
jobs:
  pure-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow pytest
      - run: python -m compileall -q custom_components tests
      - run: python -m pytest -q tests/test_pure_engine.py
