name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: >-
          python -m pip install Pillow pytest pytest-asyncio
          aiohttp probatio voluptuous ruff==0.14.3
      - run: python -m compileall -q custom_components tests
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p pytest_asyncio.plugin -q -o asyncio_default_fixture_loop_scope=function tests
      - run: >-
          ruff check custom_components/activity_images tests
          --select F,E4,E7,E9

  ha-runtime-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ha-version: ['2026.11.0', '2026.11.3']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install target Home Assistant and conversation dependencies
        run: >-
          python -m pip install homeassistant==${{ matrix.ha-version }}
          gazetteer-matcher==1.1.0 hassil==3.12.1
          home-assistant-intents==2026.10.27 pytest pytest-asyncio coverage==7.17.5 mypy==2.4.1
      - name: Enforce strict typing against target Home Assistant
        run: python -m mypy --strict --no-incremental custom_components/activity_images
      - name: Measure all Python modules and native HA runtime
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m coverage run --source=custom_components/activity_images -m pytest -p pytest_asyncio.plugin -q -o asyncio_default_fixture_loop_scope=function tests
          for script in tests/smoke*.py; do
            python -m coverage run --append --source=custom_components/activity_images "$script"
          done
          python -m coverage report -m
          python -m coverage json -o coverage.json
          python tests/check_coverage.py coverage.json
