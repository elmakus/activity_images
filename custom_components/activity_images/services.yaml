generate_image:
  name: Generate activity image
  description: Generate or reuse an image for a named activity. Optional response contains image_url, reused, and processing status.
  fields:
    title:
      name: Activity title
      required: true
      selector:
        text:
    force:
      name: Generate a new image instead of using cache
      selector:
        boolean:
resolve_images:
  name: Resolve activity images
  description: Find cached images and optionally enqueue any missing activities for background generation.
  fields:
    titles:
      name: Activity titles
      required: true
      selector:
        text:
          multiple: true
    enqueue_missing:
      name: Generate missing in background
      selector:
        boolean:
link_existing_image:
  name: Link existing local image
  description: Assign a PNG already present in /config/www/activity_images to an activity title without generating a new one.
  fields:
    title:
      name: Activity title
      required: true
      selector:
        text:
    image_url:
      name: Local PNG URL
      description: A URL starting with /local/activity_images/ and ending in .png
      required: true
      selector:
        text:
refresh_calendars:
  name: Refresh calendar images
  description: >-
    Read upcoming events and refresh the sensor. This normal scan may queue
    authorized automatic work. Use Calendar Coverage for a no-AI refresh.
queue_status:
  name: Get queue status
  description: Return pending activities, current activity and failed titles. Failed titles are not retried automatically.
cancel_queued:
  name: Cancel queued activities
  fields:
    titles:
      name: Titles
      required: true
      selector:
        text:
          multiple: true
clear_errors:
  name: Clear queue failures
  description: >-
    Clear recorded errors without authorizing another paid request.
    Retry barriers remain until an explicitly authorized retry.
forget_image:
  name: Forget cached image
  description: Forget a title or image URL without deleting the underlying image file.
  fields:
    title:
      name: Activity title
      selector:
        text:
    image_url:
      name: Image URL
      selector:
        text:
